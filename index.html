<html lang="uk">

    <style>
        :root {
            --primary: #8a2be2;
            --primary-dark: #7a1bd2;
            --secondary: #00d4ff;
            --dark: #1a1a2e;
            --light: #f8f9fa;
            --gray: #6c757d;
            --success: #28a745;
            --danger: #dc3545;
            --warning: #ffc107;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--dark) 0%, #16213e 100%);
            color: var(--light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 500px;
            width: 100%;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo-icon {
            font-size: 48px;
            margin-bottom: 10px;
            display: block;
            text-shadow: 0 0 20px var(--secondary);
        }
        
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }
        
        .subtitle {
            text-align: center;
            color: var(--gray);
            margin-bottom: 30px;
            font-size: 16px;
        }
        
        .section {
            display: none;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        .section.active {
            display: block;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--secondary);
            border-radius: 50%;
            margin: 0 auto 20px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .tags-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .tag-card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }
        
        .tag-card:hover {
            transform: translateY(-5px);
            border-color: var(--secondary);
            box-shadow: 0 10px 20px rgba(0, 212, 255, 0.2);
            background: rgba(255, 255, 255, 0.12);
        }
        
        .tag-card.active {
            border-color: var(--primary);
            background: rgba(138, 43, 226, 0.15);
        }
        
        .tag-color {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            margin: 0 auto 10px;
            border: 3px solid rgba(255, 255, 255, 0.2);
        }
        
        .tag-number {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
            color: white;
        }
        
        .tag-info {
            font-size: 12px;
            color: var(--gray);
            margin-bottom: 5px;
        }
        
        .tag-sound {
            font-size: 11px;
            color: var(--secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        
        .sounds-container {
            max-height: 400px;
            overflow-y: auto;
            padding-right: 10px;
            margin-bottom: 25px;
        }
        
        .sounds-container::-webkit-scrollbar {
            width: 6px;
        }
        
        .sounds-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        
        .sounds-container::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }
        
        .sound-item {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 15px;
            border: 2px solid transparent;
        }
        
        .sound-item:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateX(5px);
        }
        
        .sound-item.selected {
            background: rgba(138, 43, 226, 0.2);
            border-color: var(--primary);
        }
        
        .sound-icon {
            font-size: 24px;
            width: 40px;
            height: 40px;
            background: rgba(138, 43, 226, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .sound-info {
            flex: 1;
        }
        
        .sound-name {
            font-size: 16px;
            font-weight: bold;
            color: white;
            margin-bottom: 3px;
        }
        
        .sound-desc {
            font-size: 12px;
            color: var(--gray);
        }
        
        .sound-check {
            color: var(--secondary);
            font-size: 20px;
            font-weight: bold;
        }
        
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(45deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 10px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(138, 43, 226, 0.3);
            background: linear-gradient(45deg, var(--primary-dark), var(--primary));
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 20px rgba(255, 255, 255, 0.1);
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--success);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            animation: slideInRight 0.3s ease;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: 350px;
        }
        
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        .notification.error {
            background: var(--danger);
        }
        
        .notification-icon {
            font-size: 20px;
        }
        
        .no-tags {
            text-align: center;
            padding: 40px 20px;
        }
        
        .no-tags-icon {
            font-size: 48px;
            margin-bottom: 20px;
            color: var(--gray);
        }
        
        .tag-preview {
            text-align: center;
            margin-bottom: 25px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
        }
        
        .preview-color {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 0 auto 15px;
            border: 4px solid rgba(255, 255, 255, 0.2);
        }
        
        .preview-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
            color: white;
        }
        
        .preview-subtitle {
            color: var(--gray);
            font-size: 14px;
        }
        
        .login-container {
            text-align: center;
            padding: 20px;
        }
        
        .login-icon {
            font-size: 64px;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        .login-message {
            font-size: 18px;
            margin-bottom: 10px;
            color: var(--secondary);
        }
        
        .login-details {
            color: var(--gray);
            font-size: 14px;
            margin-bottom: 30px;
        }
        
        .color-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 5px;
        }
    </style>
</head>

        // Главная функция инициализации
        async function initApp() {
            try {
                // Проверяем параметры URL
                const urlParams = new URLSearchParams(window.location.search);
                const userId = urlParams.get('user');
                const tagId = urlParams.get('tag');
                
                // Пробуем найти пользователя по userId
                if (userId) {
                    await tryAutoLogin(userId);
                    return;
                }
                
                // Если нет параметров, проверяем localStorage
                const savedLogin = localStorage.getItem('nfc_login');
                const savedPassword = localStorage.getItem('nfc_password');
                
                if (savedLogin && savedPassword) {
                    await manualLogin(savedLogin, savedPassword);
                    return;
                }
                
                // Если ничего не найдено - показываем экран авторизации
                showLoginScreen();
                
            } catch (error) {
                console.error('Ошибка инициализации:', error);
                showNotification('Помилка завантаження', true);
                showLoginScreen();
            }
        }
        
        // Автоматический вход по ID пользователя
        async function tryAutoLogin(userId) {
            try {
                updateLoginStatus('Пошук користувача...');
                
                // Ищем пользователя в базе данных
                const userDoc = await db.collection('users').doc(userId.toString()).get();
                
                if (!userDoc.exists) {
                    throw new Error('Користувач не знайдений');
                }
                
                const userData = userDoc.data();
                currentUser = {
                    user_id: userData.user_id,
                    login: userData.login,
                    password: userData.password,
                    docId: userDoc.id
                };
                
                // Сохраняем в localStorage для будущих входов
                localStorage.setItem('nfc_login', userData.login);
                localStorage.setItem('nfc_password', userData.password);
                
                updateLoginStatus('Завантаження міток...');
                
                // Загружаем метки пользователя
                await loadUserTags();
                
                showNotification('Авторизація успішна!');
                
            } catch (error) {
                console.error('Ошибка автоматического входа:', error);
                updateLoginStatus('Помилка авторизації', true);
                
                // Показываем кнопку для ручного входа
                setTimeout(() => {
                    document.getElementById('manualLogin').style.display = 'block';
                }, 2000);
            }
        }
        
        // Ручной вход по логину и паролю
        async function manualLogin(login, password) {
            try {
                updateLoginStatus('Перевірка даних...');
                
                const usersRef = db.collection('users');
                const snapshot = await usersRef
                    .where('login', '==', login)
                    .where('password', '==', password)
                    .get();
                
                if (snapshot.empty) {
                    throw new Error('Невірний логін або пароль');
                }
                
                snapshot.forEach(doc => {
                    currentUser = {
                        ...doc.data(),
                        docId: doc.id
                    };
                });
                
                // Загружаем метки пользователя
                await loadUserTags();
                
            } catch (error) {
                console.error('Ошибка ручного входа:', error);
                showNotification('Помилка входу', true);
                showLoginScreen();
            }
        }
        
        // Обновление статуса авторизации
        function updateLoginStatus(message, isError = false) {
            const statusElement = document.getElementById('loginStatus');
            if (statusElement) {
                statusElement.textContent = message;
                statusElement.style.color = isError ? 'var(--danger)' : 'var(--secondary)';
            }
        }
        
        // Загрузка меток пользователя
        async function loadUserTags() {
            try {
                hideAllSections();
                document.getElementById('tagsSection').classList.add('active');
                
                const tagsListElement = document.getElementById('tagsList');
                tagsListElement.innerHTML = '';
                
                // Получаем метки пользователя
                const tagsRef = db.collection('user_tags')
                    .doc(currentUser.user_id.toString())
                    .collection('tags');
                
                const snapshot = await tagsRef.orderBy('tag_number').get();
                
                if (snapshot.empty) {
                    document.getElementById('noTagsMessage').style.display = 'block';
                    return;
                }
                
                userTags = [];
                snapshot.forEach(doc => {
                    const tag = {
                        id: doc.id,
                        ...doc.data()
                    };
                    userTags.push(tag);
                    
                    // Создаем карточку метки
                    const colorHex = COLOR_MAP[tag.color] || '#cccccc';
                    const borderStyle = tag.color === 'white' ? 'border-color: #666;' : '';
                    
                    const tagElement = document.createElement('div');
                    tagElement.className = 'tag-card';
                    tagElement.onclick = () => selectTag(tag);
                    
                    // Определяем иконку звука
                    let soundIcon = '🔕';
                    let soundName = 'Без звуку';
                    
                    if (tag.sound_icon) {
                        soundIcon = tag.sound_icon;
                        soundName = tag.sound_name || 'Звук';
                    }
                    
                    tagElement.innerHTML = `
                        <div class="tag-color" style="background-color: ${colorHex}; ${borderStyle}"></div>
                        <div class="tag-number">Мітка #${tag.tag_number}</div>
                        <div class="tag-info">${COLOR_NAMES[tag.color] || tag.color}</div>
                        <div class="tag-sound">
                            ${soundIcon} ${soundName.substring(0, 10)}${soundName.length > 10 ? '...' : ''}
                        </div>
                    `;
                    
                    tagsListElement.appendChild(tagElement);
                });
                
            } catch (error) {
                console.error('Ошибка загрузки меток:', error);
                showNotification('Помилка завантаження міток', true);
            }
        }
        
        // Выбор метки для настройки
        function selectTag(tag) {
            selectedTag = tag;
            
            // Обновляем превью метки
            const previewElement = document.getElementById('tagPreview');
            const colorHex = COLOR_MAP[tag.color] || '#cccccc';
            const borderStyle = tag.color === 'white' ? 'border-color: #666;' : '';
            
            previewElement.innerHTML = `
                <div class="preview-color" style="background-color: ${colorHex}; ${borderStyle}"></div>
                <div class="preview-title">Мітка #${tag.tag_number}</div>
                <div class="preview-subtitle">${COLOR_NAMES[tag.color] || tag.color}</div>
            `;
            
            // Показываем список звуков
            showSoundsList();
        }
        
        // Показать список звуков
        function showSoundsList() {
            hideAllSections();
            document.getElementById('soundsSection').classList.add('active');
            
            const soundsListElement = document.getElementById('soundsList');
            soundsListElement.innerHTML = '';
            
            SOUNDS.forEach(sound => {
                const isSelected = selectedTag.sound_id === sound.id;
                
                const soundElement = document.createElement('div');
                soundElement.className = `sound-item ${isSelected ? 'selected' : ''}`;
                soundElement.onclick = () => selectSound(sound);
                
                soundElement.innerHTML = `
                    <div class="sound-icon">${sound.icon}</div>
                    <div class="sound-info">
                        <div class="sound-name">${sound.name}</div>
                        <div class="sound-desc">${sound.description}</div>
                    </div>
                    ${isSelected ? '<div class="sound-check">✓</div>' : ''}
                `;
                
                soundsListElement.appendChild(soundElement);
            });
        }
        
        // Выбор звука для метки
        async function selectSound(sound) {
            try {
                // Обновляем метку в базе данных
                const tagRef = db.collection('user_tags')
                    .doc(currentUser.user_id.toString())
                    .collection('tags')
                    .doc(selectedTag.id);
                
                await tagRef.update({
                    sound_id: sound.id,
                    sound_name: sound.name,
                    sound_icon: sound.emoji || '🔔',
                    sound_file_name: sound.fileName,
                    updated_at: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                // Обновляем локальные данные
                selectedTag.sound_id = sound.id;
                selectedTag.sound_name = sound.name;
                selectedTag.sound_icon = sound.emoji || '🔔';
                
                showNotification(`Звук "${sound.name}" збережено!`);
                
                // Возвращаемся к списку меток через 1 секунду
                setTimeout(() => {
                    loadUserTags();
                }, 1000);
                
            } catch (error) {
                console.error('Ошибка сохранения звука:', error);
                showNotification('Помилка збереження звука', true);
            }
        }
        
        // Выход из аккаунта
        function logout() {
            currentUser = null;
            selectedTag = null;
            userTags = [];
            
            // Очищаем localStorage
            localStorage.removeItem('nfc_login');
            localStorage.removeItem('nfc_password');
            
            // Показываем экран авторизации
            showLoginScreen();
        }
        
        // Назад к списку меток
        function backToTags() {
            loadUserTags();
        }
        
        // Показать экран авторизации
        function showLoginScreen() {
            hideAllSections();
            document.getElementById('loginSection').classList.add('active');
        }
        
        // Скрыть все секции
        function hideAllSections() {
            document.querySelectorAll('.section').forEach(section => {
                section.classList.remove('active');
            });
        }
        
        // Показать уведомление
        function showNotification(message, isError = false) {
            const notification = document.createElement('div');
            notification.className = `notification ${isError ? 'error' : ''}`;
            notification.innerHTML = `
                <div class="notification-icon">${isError ? '❌' : '✅'}</div>
                <div>${message}</div>
            `;
            
            document.body.appendChild(notification);
            
            // Удаляем уведомление через 3 секунды
            setTimeout(() => {
                notification.style.animation = 'slideInRight 0.3s ease reverse';
                setTimeout(() => {
                    notification.remove();
                }, 300);
            }, 3000);
        }
        
        // Инициализация при загрузке страницы
        window.addEventListener('load', () => {
            setTimeout(() => {
                initApp();
            }, 1000); // Небольшая задержка для плавности
        });
    </script>
